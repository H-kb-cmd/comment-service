server.port = 8081

# ---------------------------------------------------------------------------
# 数据源：真实凭证请通过环境变量注入，切勿把账号密码提交到仓库
#   DB_URL / DB_USERNAME / DB_PASSWORD
# ---------------------------------------------------------------------------
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/comment?serverTimezone=GMT%2B8}
spring.datasource.username = ${DB_USERNAME:root}
spring.datasource.password = ${DB_PASSWORD:}

mybatis.mapper-locations = classpath:com/youkeda/comment/dao/*.xml

# ---------------------------------------------------------------------------
# Druid 监控页面：DRUID_USERNAME / DRUID_PASSWORD
# ---------------------------------------------------------------------------
spring.datasource.druid.stat-view-servlet.enabled = true
spring.datasource.druid.stat-view-servlet.url-pattern = /druid/*
spring.datasource.druid.stat-view-servlet.login-username = ${DRUID_USERNAME:admin}
spring.datasource.druid.stat-view-servlet.login-password = ${DRUID_PASSWORD:}
spring.datasource.druid.stat-view-servlet.allow =
spring.datasource.druid.stat-view-servlet.deny =

# ---------------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties = false
spring.jackson.default-property-inclusion = non_null

# ---------------------------------------------------------------------------
# 服务注册发现：NACOS_ADDR
# ---------------------------------------------------------------------------
spring.cloud.nacos.discovery.server-addr = ${NACOS_ADDR:127.0.0.1:8848}
